<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>辉夜の小窝</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "Noto Sans SC", sans-serif;
    background: #0a0a0a;
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
    padding: 20px;
}

/* 毛玻璃卡片 */
.card-glass {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
}

.section-title {
    font-size: 18px;
    color: #ffffff;
    margin-bottom: 12px;
    border-left: 3px solid #ff6b6b;
    padding-left: 10px;
    font-weight: 700;
}

.link-list a {
    display: block;
    color: #e0e0e0;
    text-decoration: none;
    padding: 10px 12px;
    margin: 4px 0;
    border-radius: 10px;
    transition: all 0.2s;
    background: rgba(255,255,255,0.03);
}

.link-list a:hover {
    background: rgba(255,255,255,0.12);
    transform: translateX(4px);
}

.avatar-block {
    text-align: center;
    padding: 24px 0 16px;
}

.avatar-block img {
    width: 80px;
    height: 80px;
    border-radius: 40px;
    border: 2px solid rgba(255,255,255,0.25);
    object-fit: cover;
}

.avatar-block h2 {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 2px;
}

.avatar-block p {
    font-size: 13px;
    color: #aaa;
    margin-top: 4px;
}

.container {
    max-width: 640px;
    margin: 0 auto;
}

.footer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid rgba(255,255,255,0.1);
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #ccc;
    z-index: 999;
}

.footer-bar span { opacity: 0.8; }

/* 搭建提示弹窗 */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
}

.modal-box {
    background: rgba(255,255,255,0.09);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 36px 44px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    box-shadow: 0 8px 42px rgba(0,0,0,0.45);
}

.modal-box h3 {
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 14px;
    letter-spacing: 3px;
}

.modal-box p {
    font-size: 15px;
    color: #bbb;
    line-height: 1.6;
    margin-bottom: 24px;
}

.modal-btn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 10px 34px;
    border-radius: 99px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.25s;
}

.modal-btn:hover { background: rgba(255,255,255,0.22); }

/* 飘落特效 */
.falling-name {
    position: fixed;
    top: -40px;
    pointer-events: none;
    white-space: nowrap;
    font-weight: 300;
    opacity: 0.85;
    z-index: 1500;
    animation: fallDown linear forwards;
}

@keyframes fallDown {
    0% { transform: translateY(0); opacity: 0.95; }
    70% { opacity: 0.35; }
    100% { opacity: 0; }
}
</style>
</head>
<body>

<!-- 搭建提示弹窗 -->
<div id="welcomeModal" class="modal-overlay">
  <div class="modal-box">
    <h3>✨ 辉夜の小窝</h3>
    <p>网站当前正在搭建中<br/>部分功能暂不可用，敬请期待</p>
    <button class="modal-btn" onclick="closeModal()">我知道了</button>
  </div>
</div>

<div class="container">

  <!-- 头像区块 -->
  <div class="card-glass avatar-block">
    <img src="https://files.catbox.moe/your-avatar.jpg" alt="avatar" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23666%22/><text x=%2250%22 y=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2236%22>?</text></svg>'">
    <h2>月月子代代雪</h2>
    <p>一只在互联网冲浪的小透明</p>
  </div>

  <!-- 星标项目 -->
  <div class="card-glass">
    <div class="section-title">⭐ 星标项目</div>
    <div class="link-list">
      <a href="https://github.com/furnian/ylypagehome" target="_blank">📦 ylypagehome — 个人主页源码</a>
      <a href="https://github.com/yueyuezidaidaixue" target="_blank">🧑💻 我的 GitHub</a>
    </div>
  </div>

  <!-- 开源仓库 -->
  <div class="card-glass">
    <div class="section-title">📂 开源仓库</div>
    <div class="link-list">
      <a href="https://github.com/furnian?tab=repositories" target="_blank">🔗 全部仓库</a>
    </div>
  </div>

  <!-- 其他空间 -->
  <div class="card-glass">
    <div class="section-title">🌐 其他空间</div>
    <div class="link-list">
      <a href="#" target="_blank">📺 Bilibili</a>
      <a href="#" target="_blank">🐦 Twitter / X</a>
    </div>
  </div>

  <!-- 占位空白 -->
  <div style="height:60px;"></div>
</div>

<!-- 底部信息栏 -->
<div class="footer-bar">
  <span>© 2026 月月子代代雪</span>
  <span id="liveTime">--:--:--</span>
</div>

<script>
// 关闭弹窗
function closeModal() {
  document.getElementById('welcomeModal').style.display = 'none';
}

// 实时时钟
function updateClock() {
  const now = new Date();
  const s = String(now.getHours()).padStart(2,'0') + ':' +
            String(now.getMinutes()).padStart(2,'0') + ':' +
            String(now.getSeconds()).padStart(2,'0');
  document.getElementById('liveTime').textContent = s;
}
setInterval(updateClock, 1000);
updateClock();

// ========== 飘落特效 ==========
const names = [
  '雷电将军','纳西妲','芙宁娜','胡桃','甘雨','刻晴','神里绫华','宵宫',
  '八重神子','妮露','夜兰','申鹤','优菈','可莉','七七','莫娜',
  '布洛妮娅','希儿','银狼','符玄','镜流','卡芙卡','黑天鹅','花火',
  '黄泉','知更鸟','流萤','阮·梅','托帕','克拉拉','阿米娅','陈',
  '能天使','斯卡蒂','W','凯尔希','缪尔赛思','浊心斯卡蒂','归溟幽灵鲨',
  '企业','贝尔法斯特','克利夫兰','独角兽','长门','赤城','加贺','大凤',
  '一姬','二阶堂美树','凉宫杏树','藤田佳奈','四宫夏生','小鸟游雏',
  '白子','星野','爱丽丝','日奈','亚都梨','芹香'
];

function randomBetween(min, max) {
  return Math.random() * (max - min) + min;
}

function spawnName() {
  const el = document.createElement('div');
  el.className = 'falling-name';
  el.textContent = names[Math.floor(Math.random() * names.length)];
  
  const fontSize = randomBetween(14, 28);
  const speed = randomBetween(6, 14);
  const colors = ['#ffadad','#ffd6a5','#fdffb6','#caffbf','#a0c4ff','#bdb2ff'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  
  el.style.left = randomBetween(5, 92) + '%';
  el.style.fontSize = fontSize + 'px';
  el.style.color = color;
  el.style.textShadow = '0 0 12px ' + color.replace('#','rgba(') + ',0.4)';
  el.style.animationDuration = speed + 's';
  
  // 下落距离 = 屏幕高度的 75%
  const fallDistance = window.innerHeight * 0.78;
  el.style.setProperty('--fall-dist', fallDistance + 'px');
  
  document.body.appendChild(el);
  
  // 动画结束后移除
  setTimeout(() => {
    if (el.parentNode) el.remove();
  }, speed * 950);
}

// 初始生成 10 个
for (let i = 0; i < 10; i++) {
  setTimeout(spawnName, i * 180);
}

// 持续生成
setInterval(() => {
  spawnName();
}, randomBetween(800, 2500));
</script>
</body>
</html>

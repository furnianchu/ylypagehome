<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>月月子代代雪</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "Noto Sans SC", sans-serif;
    background: url("https://files.catbox.moe/your-background-image.jpg") center/cover fixed;
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
    padding: 20px;
}
/* 毛玻璃卡片 */
.card-glass {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
}
.section-title {
    font-size: 16px;
    color: #ffffff;
    margin-bottom: 10px;
    border-left: 3px solid #ff6b6b;
    padding-left: 10px;
    font-weight: 600;
}
.link-list a {
    display: block;
    color: #e0e0e0;
    text-decoration: none;
    padding: 10px 12px;
    margin: 4px 0;
    border-radius: 10px;
    transition: all 0.2s;
    background: rgba(255,255,255,0.03);
}
.link-list a:hover {
    background: rgba(255,255,255,0.12);
    transform: translateX(4px);
}
.avatar-block {
    text-align: center;
    margin-bottom: 20px;
}
.avatar-block img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.3);
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}
.title {
    font-size: 26px;
    margin-top: 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}
.desc {
    font-size: 14px;
    color: #ccc;
    margin-top: 6px;
}
.footer-card {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 12px 16px;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #ddd;
    margin-top: 20px;
}
@media (max-width: 480px) {
    body { padding: 12px; }
    .title { font-size: 22px; }
}
</style>
</head>
<body>

<div class="avatar-block">
    <img src="https://files.catbox.moe/your-avatar-image.png" alt="头像">
    <h1 class="title">月月子代代雪</h1>
    <p class="desc">热爱技术，热爱生活的探索者。这里是我的个人空间，分享一些编程笔记和生活日常。</p>
</div>

<!-- 星标项目 -->
<div class="card-glass">
    <div class="section-title">🌟 星标项目</div>
    <div class="link-list">
        <a href="https://github.com/ylypagehome" target="_blank">🌍 Avenue Project (4th Avenue)</a>
        <a href="https://github.com/ylypagehome" target="_blank">📅 计划表白板</a>
        <a href="#">💻 刷课计数</a>
    </div>
</div>

<!-- 开源仓库 -->
<div class="card-glass">
    <div class="section-title">🌱 开源仓库</div>
    <div class="link-list">
        <a href="#">LeetCode 每日打卡</a>
        <a href="#">GitHub 练手</a>
    </div>
</div>

<!-- 其他空间 -->
<div class="card-glass">
    <div class="section-title">📁 其他空间</div>
    <div class="link-list">
        <a href="#">B站 星系</a>
        <a href="#">视频空间</a>
        <a href="#">日程表白板</a>
    </div>
</div>

<!-- 底部信息 -->
<div class="footer-card">
    <span>📅 今日计划 3/5</span>
    <span>⏰ <span id="datetime"></span></span>
    <span>❤️ 看板娘</span>
</div>

<script>
function updateTime() {
    document.getElementById("datetime").innerText = new Date().toLocaleString();
}
setInterval(updateTime, 1000);
updateTime();
</script>
</body>
</html>
